name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Recovery hatch. The deploy job lives in this workflow and only fires on a push that touched a
  # runtime backend file, so a deploy that was cancelled, timed out, or failed on Render could
  # previously only be re-run by inventing another backend commit — the fix itself (a workflow or
  # tests/ change) is excluded by that very filter. Hit this instead.
  workflow_dispatch:
    inputs:
      force_deploy:
        description: 'Deploy even if this commit touched no runtime backend file (recovers a lost or failed deploy)'
        type: boolean
        default: false

# Least privilege: jobs only read the repo; the deploy step uses a secret webhook.
permissions:
  contents: read

# A newer push to a PR cancels the in-flight run — but NEVER on `main`, because the deploy job
# lives in this workflow. On 2026-08-03 a docs commit pushed one minute after a backend merge
# cancelled that merge's run, and the Render deploy died with it: the fix was on `main` and not
# in production, with a green tick on the merge commit and no failure anywhere to notice.
# Superseded PR runs are still worth cancelling; a superseded `main` run is a lost deploy.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: Backend (ruff + pytest + alembic)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12' # matches backend/Dockerfile (Render runtime)
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: ruff check .
      # HYPOTHESIS_PROFILE=ci derandomizes the property tests (tests/conftest.py) so this
      # gate can never flake; randomness only hunts locally. --cov-fail-under is a ratchet:
      # set to the measured floor at the time of each change — raise it as coverage climbs,
      # never lower it to make a PR pass.
      - run: pytest -q --cov=app --cov-report=term-missing --cov-report=xml --cov-fail-under=85
        env:
          HYPOTHESIS_PROFILE: ci
      # Build the schema from migrations on a throwaway SQLite, then fail if the
      # ORM models have drifted from the migrations (a model change with no migration).
      - run: alembic upgrade head
      - run: alembic check
      # Optional: skipped (CI stays green) until the CODECOV_TOKEN secret is set.
      - name: Upload coverage to Codecov
        if: env.CODECOV_TOKEN != ''
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7
        with:
          token: ${{ env.CODECOV_TOKEN }}
          files: backend/coverage.xml
          flags: backend

  mobile:
    name: Mobile (eslint + tsc + jest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      # --coverage enforces package.json's coverageThreshold — a ratchet set just under
      # the measured floor (collectCoverageFrom covers ALL of src/, so the number is
      # honest: untested files count, unlike jest's only-what-tests-import default).
      # Raise the floors as coverage climbs; never lower them to make a PR pass.
      - run: npm test -- --ci --coverage

  docker-build:
    name: Backend image builds
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      # Build-only (no push) so a broken Dockerfile/dependency fails here, not on Render.
      # Retry transient registry hiccups (e.g. Docker Hub 503 pulling the base image) so
      # an upstream blip doesn't fail the build.
      - name: Build backend image
        run: |
          for attempt in 1 2 3; do
            if docker build -f backend/Dockerfile backend; then
              exit 0
            fi
            echo "::warning::docker build attempt $attempt failed — retrying in 15s"
            sleep 15
          done
          echo "::error::docker build failed after 3 attempts"
          exit 1

  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest
    timeout-minutes: 25 # the verify steps poll a slow free-tier build+swap
    needs: [backend, docker-build] # gate on the backend artifact's checks
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 2 # need HEAD~1 to diff what this merge changed
      # Only the backend runs on Render, so a mobile-only / docs merge doesn't need a
      # redeploy — and on the free tier a redeploy wipes the ephemeral DB (and re-scrapes
      # only DEFAULT_PLZ). Deploy when this merge touched a RUNTIME backend file, but skip
      # lint/test/example files that never enter the image (backend/Dockerfile COPYs only
      # app/, alembic/, requirements.txt). This is a denylist, NOT an allowlist of runtime
      # paths, so a NEW runtime file still deploys — err toward deploying: a missed deploy
      # ships stale code, an extra one just re-scrapes the ephemeral DB. A mixed change
      # (e.g. app/ + tests/) still deploys because the app/ line survives the filter.
      - name: Detect runtime-affecting backend changes
        id: detect
        env:
          # Via env, never interpolated into the script: workflow inputs are attacker-shaped text.
          FORCE_DEPLOY: ${{ inputs.force_deploy }}
        run: |
          if [ "$FORCE_DEPLOY" = "true" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "force_deploy requested — deploying regardless of the path filter."
            exit 0
          fi
          CHANGED=$(git diff --name-only HEAD~1 HEAD \
            | grep -E '^(backend/|render\.yaml$)' \
            | grep -vE '^backend/(ruff\.toml$|pytest\.ini$|\.env\.example$|tests/)' \
            || true)
          if [ -n "$CHANGED" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Runtime-affecting backend files changed — will deploy:"
            echo "$CHANGED" | sed 's/^/  /'
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Only lint/test/example (or mobile/docs) files changed — skipping deploy."
          fi
      - name: Trigger Render deploy hook
        id: trigger
        if: steps.detect.outputs.changed == 'true'
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "RENDER_DEPLOY_HOOK_URL not set — skipping deploy."
            echo "Add the secret (and turn off Render auto-deploy) to enable gated deploys."
            echo "fired=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          before=$(curl -fsS --max-time 30 "https://grocery-helper-sw6c.onrender.com/health" \
            | python3 -c 'import sys,json;print(json.load(sys.stdin).get("commit") or "")' \
            2>/dev/null || true)
          echo "before=${before}" >> "$GITHUB_OUTPUT"
          echo "Commit live before this deploy: '${before:-unknown}'"
          curl -fsS -X POST "$HOOK"
          echo "fired=true" >> "$GITHUB_OUTPUT"
          echo "Triggered Render deploy."

      # The hook only TRIGGERS Render — "success" above means the curl fired, nothing
      # more; Render then builds + swaps for several minutes. This bit for real: a
      # feature shipped green and never appeared in prod because its degraded path fired
      # on every run. So: poll /health until the RUNNING commit is the merged SHA (the
      # backend exposes RENDER_GIT_COMMIT), then verify the served FEATURE, not the
      # trigger. If a newer merge deployed over us mid-poll, note it and stand down —
      # that run's own verify covers prod.
      - name: Wait until the new code is live
        if: steps.trigger.outputs.fired == 'true'
        env:
          BASE: https://grocery-helper-sw6c.onrender.com
        run: |
          want="${GITHUB_SHA}"
          echo "Waiting for /health to report commit ${want}…"
          for i in $(seq 1 45); do
            live=$(curl -fsS --max-time 30 "$BASE/health" | python3 -c \
              'import sys,json;print(json.load(sys.stdin).get("commit") or "")' 2>/dev/null || true)
            if [ "$live" = "$want" ]; then
              echo "New code is live (poll $i)."
              exit 0
            fi
            sleep 20
          done
          # "Superseded by a newer deploy" is the ONLY benign reason our commit never went live,
          # so it must be PROVEN, never inferred from `live != want`. A newer deploy means our
          # commit is an ANCESTOR of whatever is live; a failed build leaves an ancestor of ours
          # live instead. Anything else fails closed.
          #
          # This previously compared `live` against the pre-deploy commit, which fails open the
          # moment that probe doesn't answer: on 2026-08-04 the free tier was asleep, the 30s
          # curl timed out, `before` was empty, the equality could not fire, and a Render build
          # that never landed was reported GREEN — with the next step then counting offers
          # served by the OLD code. Ancestry needs no pre-deploy reading at all.
          before="${{ steps.trigger.outputs.before }}"
          echo "commit live before this deploy: '${before:-unknown}'; live now: '${live:-none}'"
          git fetch --quiet --depth=100 origin main || true
          if [ -n "$live" ] && git merge-base --is-ancestor "$want" "$live" 2>/dev/null; then
            echo "::warning::a strictly newer commit (${live}) is live — superseded; standing down."
            exit 0
          fi
          echo "::error::deploy never became live within ~15 min (live='${live:-none}', wanted ${want}) — the Render build likely failed"
          exit 1

      - name: Verify the served deals (the feature, not the deploy)
        if: steps.trigger.outputs.fired == 'true'
        env:
          BASE: https://grocery-helper-sw6c.onrender.com
        run: |
          # The boot-scrape runs at startup; give it a few retries before judging.
          # Deliberately NOT filtered by plz: the boot-scrape fills whatever DEFAULT_PLZ is
          # set to in the Render dashboard, which this workflow can't see (it's off-repo, and
          # a real postal code must never be committed). Pinning a plz here silently asserts
          # a value the server may not use — which is exactly how this gate went red on a
          # perfectly healthy deploy once DEFAULT_PLZ was set. "Serves any deals at all" is
          # the invariant we actually care about, and it can't drift.
          for i in $(seq 1 10); do
            count=$(curl -fsS --max-time 60 "$BASE/api/offers?limit=2000" \
              | python3 -c 'import sys,json;print(len(json.load(sys.stdin)))' 2>/dev/null || echo 0)
            echo "poll $i: served offers = $count"
            if [ "$count" -gt 0 ] 2>/dev/null; then
              echo "Prod serves data on the new code."
              exit 0
            fi
            sleep 30
          done
          echo "::error::prod serves no offers on the new deploy — the boot-scrape likely failed"
          exit 1
